name: 🚀 Deploy site estático via FTP

on:
  push:
    branches:
      - main  

jobs:
  ftp-deploy:
    name: 📂 Deploy direto para Hostinger
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obter código mais recente
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Gerar build de produção
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: 📤 Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /public_html/
          local-dir: ./dist/
          dangerous-clean-slate: true

      - name: 🔎 Validar arquivos publicados
        shell: bash
        run: |
          script_src="$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2)"
          test -n "$script_src"
          response_headers="$(curl -fsSI "https://ipps.com.br${script_src}")"
          echo "$response_headers"
          echo "$response_headers" | grep -Eiq 'content-type:.*(application/javascript|text/javascript)'
