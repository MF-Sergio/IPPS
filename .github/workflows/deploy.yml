name: 🚀 Deploy site estático via FTP

on:
  push:
    branches:
      - main

# Nunca rodar dois deploys ao mesmo tempo: com dangerous-clean-slate, dois
# uploads simultâneos podem apagar os arquivos um do outro. Um novo push espera
# o deploy em andamento terminar.
concurrency:
  group: deploy-producao
  cancel-in-progress: false

jobs:
  ftp-deploy:
    name: 📂 Deploy do front-end via FTP
    runs-on: ubuntu-latest

    steps:
      - name: 🚚 Obter código mais recente
        uses: actions/checkout@v4

      - name: 📦 Instalar dependências
        run: npm ci

      - name: 🏗️ Gerar build de produção
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}

      - name: 📤 Enviar arquivos para a hospedagem
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          local-dir: ./dist/
          # A pasta de destino deve ser exclusiva do site (public_html/Web).
          dangerous-clean-slate: true

      # Conferência principal: lê de volta, pelo próprio FTP, o que foi publicado.
      # O FTP é o canal que a hospedagem autoriza; o firewall (WAF) da Locaweb
      # bloqueia acessos HTTP vindos dos servidores do GitHub Actions.
      - name: 🔐 Conferir arquivos publicados (FTP)
        shell: bash
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
        run: |
          host="${FTP_SERVER#ftp://}"
          host="${host#ftps://}"
          host="${host%/}"

          # Mesmo diretório usado no upload. Caminho absoluto ("/public_html/")
          # vira "%2F..." na URL; caminho relativo parte da pasta inicial do login.
          dir="${FTP_SERVER_DIR#./}"
          case "$dir" in
            /*) dir_path="%2F${dir#/}" ;;
            *)  dir_path="$dir" ;;
          esac
          dir_path="${dir_path%/}"
          dir_path="${dir_path// /%20}"
          base_url="ftp://${host}/${dir_path:+${dir_path}/}"

          ftp_curl() {
            curl -sS --fail --max-time 60 --user "${FTP_USERNAME}:${FTP_PASSWORD}" "$@"
          }

          remote_index="$(mktemp)"
          trap 'rm -f "$remote_index"' EXIT

          if ! ftp_curl -o "$remote_index" "${base_url}index.html"; then
            echo "::error::Não foi possível baixar index.html por FTP da pasta de destino (FTP_SERVER_DIR)."
            exit 1
          fi

          if grep -Fq '/src/main.tsx' "$remote_index"; then
            echo "::error::O index.html no servidor é o arquivo fonte (/src/main.tsx), não o do build."
            exit 1
          fi

          if ! cmp -s dist/index.html "$remote_index"; then
            echo "::error::O index.html no servidor é diferente do dist/index.html deste build."
            exit 1
          fi
          echo "✅ index.html no servidor é idêntico ao do build."

          # Todo arquivo referenciado pelo index.html precisa estar no servidor.
          files="$(grep -oE '"/assets/[^"]+"' dist/index.html | tr -d '"' | sed 's|^/||' | sort -u || true)"
          if [ -z "$files" ]; then
            echo "::error::dist/index.html não referencia nenhum arquivo em /assets."
            exit 1
          fi
          if [ -f dist/.htaccess ]; then
            files="${files}"$'\n'".htaccess"
          fi

          missing=0
          while IFS= read -r file; do
            if ftp_curl -I -o /dev/null "${base_url}${file}"; then
              echo "  ok  ${file}"
            else
              echo "::error::Arquivo ausente no servidor: ${file}"
              missing=1
            fi
          done <<< "$files"

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi
          echo "✅ Todos os arquivos referenciados estão no servidor."

      # Conferência complementar pelo domínio. A Locaweb costuma bloquear os
      # servidores do GitHub (403 seguido de timeout), então uma falha de acesso
      # vira apenas aviso. Se o domínio responder, o conteúdo ainda é validado.
      - name: 🔎 Conferir página no domínio
        shell: bash
        env:
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: |
          public_site_url="${PUBLIC_SITE_URL:-https://ipps.com.br}"
          check_url="${public_site_url%/}/?deploy=${GITHUB_SHA}"
          expected_script="$(grep -oE 'src="/assets/[^"]+\.js"' dist/index.html | head -n 1 | cut -d'"' -f2 || true)"
          user_agent="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          published="$(mktemp)"

          http_code="$(curl -sSL -A "$user_agent" -H 'Cache-Control: no-cache' \
            --max-time 20 -o "$published" -w '%{http_code}' "$check_url" || true)"
          echo "Resposta do domínio: HTTP ${http_code}"

          if [ "$http_code" != "200" ]; then
            echo "::warning::O domínio não pôde ser conferido a partir do GitHub Actions (HTTP ${http_code}); a hospedagem bloqueia esses servidores. Os arquivos já foram conferidos por FTP."
            exit 0
          fi

          if grep -Fq '/src/main.tsx' "$published"; then
            echo "::error::O domínio está servindo o index.html fonte (/src/main.tsx), não o do build."
            exit 1
          fi

          if [ -n "$expected_script" ] && ! grep -Fq "$expected_script" "$published"; then
            echo "::error::O domínio responde, mas não serve este build (${expected_script}). Verifique se FTP_SERVER_DIR é o document root do domínio."
            exit 1
          fi
          echo "✅ O domínio está servindo este build."
